name: Post next reel

on:
  schedule:
    # GitHub skips many scheduled runs, so check every 20 minutes; post_next.py only posts once
    # 115 minutes have passed since the last post, which keeps posts about 2 hours apart.
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # the queue as it is now, not as it was when this run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the next queued reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post_next.py
      - name: Save the queue
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "bloodpact-poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "Posted a reel $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

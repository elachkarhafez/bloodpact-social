name: Reel insights

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Print reel stats by posting time
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python insights.py

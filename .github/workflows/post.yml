name: Post next reel

on:
  schedule:
    - cron: "50 */2 * * *" # every 2 hours at :50 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the next queued reel
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python post_next.py
      - name: Save the queue
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "bloodpact-poster"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add queue.json
            git commit -m "Posted a reel $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
